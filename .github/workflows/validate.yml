name: Validate
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [dashboard, agent_service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
      - run: python -m unittest discover -s tests -v
      - name: Static security checks
        run: |
          if [ "${{ matrix.service }}" = dashboard ]; then
            bandit -q app.py storage.py analytics.py investigations.py replay.py
          else
            bandit -q service.py
          fi
      - name: Dependency audit
        run: |
          if [ "${{ matrix.service }}" = agent_service ]; then
            # Existing Cloud Build exception: ADK pins an affected inbound tracestate
            # parser that this service does not call. Remove once ADK permits >=1.45.1.
            pip-audit -r requirements.txt --ignore-vuln CVE-2026-114603
          else
            pip-audit -r requirements.txt
          fi
