# Pipeline: log-analyzer-pr-validation. Automatic on PRs targeting dev or main.
# The event/branch/name is configured in Cloud Build > Triggers.
# Steps execute in order; any failure stops the build. Nothing is published.
steps:
- id: check-interface
  name: node:22-alpine
  entrypoint: sh
  args: [-ec, 'node --check static/app.js && node --check static/replay.js']
- id: test-dashboard
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
    python -m unittest discover -s tests -v
    bandit -q app.py storage.py analytics.py investigations.py replay.py
    pip-audit -r requirements.txt --progress-spinner off
- id: test-agent
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    cd agent_service
    pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
    python -m unittest discover -s tests -v
    bandit -q service.py
    pip-audit -r requirements.txt --progress-spinner off
- id: build-images
  name: gcr.io/cloud-builders/docker
  entrypoint: sh
  args:
  - -ec
  - |
    docker build -t log-analyzer-ci .
    docker build -t adk-agent-ci agent_service
    docker save -o /workspace/dashboard.tar log-analyzer-ci
    docker save -o /workspace/agent.tar adk-agent-ci
- id: scan-images
  name: aquasec/trivy:0.75.0
  entrypoint: sh
  args:
  - -ec
  - |
    trivy image --input /workspace/dashboard.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
    trivy image --input /workspace/agent.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
tags: [log-analyzer, ci, mahmoud]
options:
  logging: CLOUD_LOGGING_ONLY
