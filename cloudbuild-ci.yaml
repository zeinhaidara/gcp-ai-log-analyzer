# Pull requests: test and scan the app, then build and scan its container.
steps:
- id: test
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
    python -m unittest discover -s tests -v
    bandit -q app.py storage.py analytics.py
    pip-audit -r requirements.txt --progress-spinner off
- id: build
  name: gcr.io/cloud-builders/docker
  args: [build, -t, log-analyzer-ci, .]
- id: export-image
  name: gcr.io/cloud-builders/docker
  args: [save, -o, /workspace/image.tar, log-analyzer-ci]
- id: scan-image
  name: aquasec/trivy:0.75.0
  entrypoint: trivy
  args: [image, --input, /workspace/image.tar, --scanners, 'vuln,secret', --severity, 'HIGH,CRITICAL', --exit-code, '1', --timeout, 10m]
tags: [log-analyzer, ci, mahmoud]
options:
  logging: CLOUD_LOGGING_ONLY
