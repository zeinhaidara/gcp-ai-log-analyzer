# Main: test -> build -> push -> deploy.
steps:
- id: test
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    pip install -r requirements.txt
    python -m unittest discover -s tests -v
- id: build
  name: gcr.io/cloud-builders/docker
  args: [build, -t, '${_IMAGE}:$BUILD_ID', .]
- id: push
  name: gcr.io/cloud-builders/docker
  args: [push, '${_IMAGE}:$BUILD_ID']
- id: deploy
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  entrypoint: gcloud
  args:
  - run
  - deploy
  - ${_SERVICE}
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_IMAGE}:$BUILD_ID
  - --service-account=${_RUNTIME_ACCOUNT}
  - --invoker-iam-check
  - --min-instances=0
  - --max-instances=${_MAX_INSTANCES}
  - --set-env-vars=STORAGE_BACKEND=gcp,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_BUCKET=${_LOG_BUCKET},FIRESTORE_DATABASE=${_DATABASE},FIRESTORE_COLLECTION=${_COLLECTION}
  - --quiet
substitutions:
  _REGION: us-central1
  _REPOSITORY: log-analyzer-dev
  _SERVICE: log-analyzer-dev-dashboard
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}
  _RUNTIME_ACCOUNT: log-analyzer-dev-dashboard@${PROJECT_ID}.iam.gserviceaccount.com
  _LOG_BUCKET: ${PROJECT_ID}-raw-logs-dev
  _DATABASE: (default)
  _COLLECTION: logs
  _MAX_INSTANCES: '1'
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
