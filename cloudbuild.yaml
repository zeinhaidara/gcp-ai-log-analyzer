# Dev: test and scan -> build and scan image -> push -> deploy.
steps:
- id: test
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
    python -m unittest discover -s tests -v
    bandit -q app.py storage.py
    pip-audit -r requirements.txt --progress-spinner off
- id: build
  name: gcr.io/cloud-builders/docker
  args: [build, -t, '${_IMAGE}:$BUILD_ID', .]
- id: export-image
  name: gcr.io/cloud-builders/docker
  args: [save, -o, /workspace/image.tar, '${_IMAGE}:$BUILD_ID']
- id: scan-image
  name: aquasec/trivy:0.75.0
  entrypoint: trivy
  args: [image, --input, /workspace/image.tar, --scanners, 'vuln,secret', --severity, 'HIGH,CRITICAL', --exit-code, '1', --timeout, 10m]
- id: push
  name: gcr.io/cloud-builders/docker
  args: [push, '${_IMAGE}:$BUILD_ID']
- id: deploy
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  entrypoint: gcloud
  args:
  - run
  - deploy
  - ${_SERVICE}
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_IMAGE}:$BUILD_ID
  - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
  - --cpu=1
  - --memory=512Mi
  - --min-instances=0
  - --max-instances=${_MAX_INSTANCES}
  - --update-labels=${_LABELS}
  - --set-env-vars=STORAGE_BACKEND=gcp,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_BUCKET=${_LOG_BUCKET},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION}
  - --quiet
substitutions:
  _REGION: us-central1
  _REPOSITORY: log-analyzer-dev
  _SERVICE: log-analyzer-dev
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/log-analyzer
  _RUNTIME_SERVICE_ACCOUNT: log-analyzer-dev-dashboard@${PROJECT_ID}.iam.gserviceaccount.com
  _LOG_BUCKET: ${PROJECT_ID}-raw-logs-dev
  _FIRESTORE_DATABASE: (default)
  _FIRESTORE_COLLECTION: logs
  _MAX_INSTANCES: '1'
  _LABELS: app=log-analyzer,environment=dev,owner=mahmoud,managed-by=cloud-build
tags: [log-analyzer, dev, mahmoud]
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
