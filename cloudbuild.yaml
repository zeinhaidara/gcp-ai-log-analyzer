# Pipeline: log-analyzer-dev-push. Automatic on pushes/PR merges into dev.
# The event/branch/name is configured in Cloud Build > Triggers.
# Tests and both image scans must pass before either image is published.
steps:
- id: test-dashboard
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
    python -m unittest discover -s tests -v
    bandit -q app.py storage.py
    pip-audit -r requirements.txt --progress-spinner off
- id: test-agent
  name: python:3.12-slim
  entrypoint: sh
  args:
  - -ec
  - |
    cd agent_service
    pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
    python -m unittest discover -s tests -v
    bandit -q service.py
    pip-audit -r requirements.txt --progress-spinner off
- id: build-images
  name: gcr.io/cloud-builders/docker
  entrypoint: sh
  args:
  - -ec
  - |
    docker build -t '${_IMAGE}:$BUILD_ID' .
    docker build -t '${_AGENT_IMAGE}:$BUILD_ID' agent_service
    docker save -o /workspace/dashboard.tar '${_IMAGE}:$BUILD_ID'
    docker save -o /workspace/agent.tar '${_AGENT_IMAGE}:$BUILD_ID'
- id: scan-images
  name: aquasec/trivy:0.75.0
  entrypoint: sh
  args:
  - -ec
  - |
    trivy image --input /workspace/dashboard.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
    trivy image --input /workspace/agent.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --timeout 10m
- id: publish-images
  name: gcr.io/cloud-builders/docker
  entrypoint: sh
  args:
  - -ec
  - |
    docker push '${_IMAGE}:$BUILD_ID'
    docker push '${_AGENT_IMAGE}:$BUILD_ID'
# Deploy the consumer first, then enable publishing in the dashboard.
- id: deploy-agent
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  entrypoint: gcloud
  args:
  - run
  - deploy
  - ${_AGENT_SERVICE}
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_AGENT_IMAGE}:$BUILD_ID
  - --service-account=${_AGENT_RUNTIME_SERVICE_ACCOUNT}
  - --cpu=1
  - --memory=1Gi
  - --concurrency=1
  - --timeout=180
  - --min-instances=0
  - --max-instances=${_MAX_INSTANCES}
  - --update-labels=${_AGENT_LABELS}
  - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_LOCATION=${_VERTEX_LOCATION},GEMINI_MODEL=${_GEMINI_MODEL},LOG_BUCKET=${_LOG_BUCKET},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION},BIGQUERY_TABLE=${_BIGQUERY_TABLE},BIGQUERY_LOCATION=${_REGION}
  - --quiet
- id: deploy-dashboard
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  entrypoint: gcloud
  args:
  - run
  - deploy
  - ${_SERVICE}
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_IMAGE}:$BUILD_ID
  - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
  - --cpu=1
  - --memory=512Mi
  - --min-instances=0
  - --max-instances=${_MAX_INSTANCES}
  - --update-labels=${_LABELS}
  - --set-env-vars=STORAGE_BACKEND=gcp,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_BUCKET=${_LOG_BUCKET},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION},INVESTIGATION_TOPIC=${_INVESTIGATION_TOPIC}
  - --quiet
# Existing resources. Override these ordinary settings in the trigger as needed.
substitutions:
  _REGION: us-central1
  _REPOSITORY: log-analyzer-dev
  _SERVICE: log-analyzer-dev
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/log-analyzer
  _RUNTIME_SERVICE_ACCOUNT: log-analyzer-dev-dashboard@${PROJECT_ID}.iam.gserviceaccount.com
  _AGENT_SERVICE: log-analyzer-dev-agent
  _AGENT_IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/adk-agent
  _AGENT_RUNTIME_SERVICE_ACCOUNT: log-analyzer-dev-agent@${PROJECT_ID}.iam.gserviceaccount.com
  _LOG_BUCKET: ${PROJECT_ID}-raw-logs-dev
  _FIRESTORE_DATABASE: (default)
  _FIRESTORE_COLLECTION: logs
  _INVESTIGATION_TOPIC: log-analyzer-dev-investigations
  _BIGQUERY_TABLE: ${PROJECT_ID}.log_analyzer_dev.incidents
  _GEMINI_MODEL: gemini-3.1-flash-lite
  _VERTEX_LOCATION: global
  _MAX_INSTANCES: '1'
  _LABELS: app=log-analyzer,environment=dev,owner=mahmoud,managed-by=cloud-build
  _AGENT_LABELS: app=log-analyzer,environment=dev,owner=zein,managed-by=cloud-build
tags: [log-analyzer, dev, mahmoud]
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
